<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Review Form - Cosmetic Vision</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica', Arial, sans-serif;
            background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #1a0b2e 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #fff;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #b794f6 0%, #e9d5ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .logo p {
            color: #c4b5fd;
            font-size: 14px;
        }

        .order-info {
            background: rgba(167, 139, 250, 0.1);
            border: 2px solid #a78bfa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .order-info h3 {
            color: #a78bfa;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .order-info p {
            color: #e9d5ff;
            margin: 6px 0;
            font-size: 14px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #fff;
            border-bottom: 2px solid rgba(167, 139, 250, 0.3);
            padding-bottom: 12px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e9d5ff;
            font-size: 14px;
        }

        .form-group input[type="number"],
        .form-group input[type="date"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(167, 139, 250, 0.3);
            border-radius: 12px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #a78bfa;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.1);
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 2px solid rgba(167, 139, 250, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkbox-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #a78bfa;
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #a78bfa;
        }

        .checkbox-item label {
            cursor: pointer;
            color: #e9d5ff;
            font-size: 14px;
            margin: 0;
        }

        .btn {
            width: 100%;
            padding: 16px 40px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(167, 139, 250, 0.3);
            margin-top: 30px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(167, 139, 250, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .status.loading {
            background: rgba(255, 243, 205, 0.2);
            color: #fbbf24;
            display: block;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            display: block;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            display: block;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .success-message.active {
            display: block;
        }

        .success-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .success-message h2 {
            font-size: 28px;
            margin-bottom: 12px;
            color: #a78bfa;
        }

        .success-message p {
            color: #e9d5ff;
            font-size: 16px;
        }

        .back-link {
            display: inline-block;
            color: #a78bfa;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Home</a>
        
        <div class="logo">
            <h1>Customer Review Form</h1>
            <p>Complete your order review</p>
        </div>

        <div class="order-info" id="orderInfo">
            <h3>📦 Your Order</h3>
            <p><strong>Customer:</strong> <span id="displayCustomerName">-</span></p>
            <p><strong>Product:</strong> <span id="displayProduct">-</span></p>
            <p><strong>Order ID:</strong> <span id="displayOrderId">-</span></p>
        </div>

        <div id="reviewForm">
            <h2 class="section-title">📋 Review & Receipt Information</h2>

            <form id="reviewFormElement">
                <div class="form-group">
                    <label for="actualUnitsReceived">Actual Units Received *</label>
                    <input type="number" id="actualUnitsReceived" required min="0" placeholder="Enter units received">
                </div>

                <div class="form-group">
                    <label for="dateGoodsReceived">Date Goods Received @ Warehouse *</label>
                    <input type="date" id="dateGoodsReceived" required>
                </div>

                <div class="form-group">
                    <label for="qualityRejects">Quality Rejects on Inspection *</label>
                    <input type="number" id="qualityRejects" required min="0" placeholder="Enter number of rejects">
                </div>

                <div class="form-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="authorisedInvoice">
                        <label for="authorisedInvoice">Authorised Invoice?</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="expectedPaymentDate">Expected Payment Date *</label>
                    <input type="date" id="expectedPaymentDate" required>
                </div>

                <div class="status" id="status"></div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    Submit Review →
                </button>
            </form>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage">
            <div class="success-icon">✅</div>
            <h2>Review Submitted Successfully!</h2>
            <p>Your review has been saved and the order has been updated.</p>
            <p style="margin-top: 12px;">Thank you for your feedback!</p>
            <button type="button" class="btn btn-primary" onclick="window.location.href='/'" style="margin-top: 30px;">
                Back to Home
            </button>
        </div>
    </div>

    <script>
        // Get order info from session storage
        const orderId = sessionStorage.getItem('orderId');
        const customerName = sessionStorage.getItem('customerName');
        const productDescription = sessionStorage.getItem('productDescription');

        // Display order info
        if (orderId && customerName && productDescription) {
            document.getElementById('displayCustomerName').textContent = customerName;
            document.getElementById('displayProduct').textContent = productDescription;
            document.getElementById('displayOrderId').textContent = orderId.substring(0, 8) + '...';
        } else {
            // No order info available
            document.getElementById('orderInfo').innerHTML = `
                <h3>⚠️ No Order Information</h3>
                <p>Please complete an order first before filling the review form.</p>
            `;
            document.getElementById('reviewFormElement').style.display = 'none';
        }

        // Handle form submission
        document.getElementById('reviewFormElement').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!orderId) {
                alert('No order ID found. Please complete an order first.');
                return;
            }

            const statusDiv = document.getElementById('status');
            const submitBtn = document.getElementById('submitBtn');

            statusDiv.className = 'status loading';
            statusDiv.textContent = '⏳ Submitting review...';
            submitBtn.disabled = true;

            const reviewData = {
                orderId: orderId,
                actualUnitsReceived: parseInt(document.getElementById('actualUnitsReceived').value),
                dateGoodsReceived: document.getElementById('dateGoodsReceived').value,
                qualityRejects: parseInt(document.getElementById('qualityRejects').value),
                authorisedInvoice: document.getElementById('authorisedInvoice').checked,
                expectedPaymentDate: document.getElementById('expectedPaymentDate').value
            };

            console.log('📤 Submitting review:', reviewData);

            try {
                const response = await fetch('/submit-review', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(reviewData)
                });

                const result = await response.json();
                console.log('📥 Response:', result);

                if (result.success) {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = '✅ Review submitted successfully!';
                    
                    // Clear session storage
                    sessionStorage.removeItem('orderId');
                    sessionStorage.removeItem('customerName');
                    sessionStorage.removeItem('productDescription');

                    // Show success message
                    document.getElementById('reviewForm').style.display = 'none';
                    document.getElementById('orderInfo').style.display = 'none';
                    document.getElementById('successMessage').classList.add('active');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = '❌ Error: ' + result.error;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('❌ Error:', error);
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ Error: ' + error.message;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
