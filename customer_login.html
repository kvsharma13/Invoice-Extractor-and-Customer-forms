<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal - Cosmetic Vision</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #1a0b2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 50px;
            max-width: 550px;
            width: 100%;
            border: 2px solid rgba(167, 139, 250, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .back-link {
            display: inline-block;
            color: #a78bfa;
            text-decoration: none;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .logo h2 {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .logo p {
            color: #c4b5fd;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e9d5ff;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(167, 139, 250, 0.3);
            border-radius: 12px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #a78bfa;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(167, 139, 250, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(167, 139, 250, 0.4);
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            color: #9ca3af;
            font-size: 14px;
        }

        .options-section {
            margin-top: 30px;
        }

        .options-title {
            text-align: center;
            color: #e9d5ff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .option-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(167, 139, 250, 0.3);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }

        .option-card:hover {
            background: rgba(167, 139, 250, 0.1);
            border-color: #a78bfa;
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(167, 139, 250, 0.3);
        }

        .option-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .option-title {
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .option-desc {
            color: #c4b5fd;
            font-size: 13px;
            line-height: 1.4;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        @media (max-width: 600px) {
            .option-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <a href="/" class="back-link">← Back to Portal Selection</a>
        
        <div class="logo">
            <div class="logo-icon">👤</div>
            <h2>Customer Portal</h2>
            <p>Access your orders and reviews</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="divider">OR</div>

        <div class="options-section">
            <div class="options-title">Continue as Guest</div>
            <div class="option-cards">
                <a href="/customer-order" class="option-card">
                    <div class="option-icon">📝</div>
                    <div class="option-title">Order Form</div>
                    <div class="option-desc">Place a new order</div>
                </a>

                <a href="/customer-review" class="option-card">
                    <div class="option-icon">⭐</div>
                    <div class="option-title">Review Form</div>
                    <div class="option-desc">Submit order review</div>
                </a>

                <a href="/invoice-extractor" class="option-card">
                    <div class="option-icon">📄</div>
                    <div class="option-title">Invoice Extractor</div>
                    <div class="option-desc">Upload & extract invoice</div>
                </a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Store customer info in session
            sessionStorage.setItem('customerEmail', email);
            sessionStorage.setItem('isLoggedIn', 'true');
            
            // Show options after login
            alert('Login successful! Please select Order Form or Review Form.');
        }
    </script>
</body>
</html>
