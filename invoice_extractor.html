<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Extractor - Cosmetic Vision</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        
        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
            background-color: white;
            color: #333;
            cursor: pointer;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f1ff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .file-name {
            margin: 15px 0;
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
        }
        
        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        
        .status.loading {
            background: #fff3cd;
            color: #856404;
            display: block;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        
        .result {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .result h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .result pre {
            background: white;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid #dee2e6;
        }
        
        .record-id {
            margin-top: 15px;
            padding: 10px;
            background: #667eea;
            color: white;
            border-radius: 8px;
        }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Home</a>
        
        <h1>📄 Invoice Extractor</h1>
        <p class="subtitle">Upload a PDF and extract data automatically</p>
        
        <div class="form-group">
            <label for="invoiceType">Invoice Type:</label>
            <select id="invoiceType">
                <option value="Customer Invoice">Customer Invoice</option>
                <option value="Shipping Invoice">Shipping Invoice</option>
            </select>
        </div>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <p>Click to upload or drag and drop</p>
            <p style="font-size: 12px; color: #999; margin-top: 5px;">PDF files only</p>
            <input type="file" id="pdfFile" accept=".pdf">
            <div class="file-name" id="fileName"></div>
        </div>
        
        <button id="uploadBtn" onclick="uploadPDF()" disabled>Upload & Extract Data</button>
        
        <div class="loader" id="loader"></div>
        <div class="status" id="status"></div>
        <div class="result" id="result"></div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('pdfFile');
        const fileName = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                fileName.textContent = '📄 ' + e.target.files[0].name;
                uploadBtn.disabled = false;
            }
        });
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#764ba2';
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#667eea';
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#667eea';
            
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type === 'application/pdf') {
                fileInput.files = files;
                fileName.textContent = '📄 ' + files[0].name;
                uploadBtn.disabled = false;
            }
        });
        
        async function uploadPDF() {
            if (!fileInput.files[0]) {
                alert('Please select a PDF file');
                return;
            }
            
            statusDiv.className = 'status loading';
            statusDiv.textContent = '⏳ Processing your PDF...';
            resultDiv.style.display = 'none';
            loader.style.display = 'block';
            uploadBtn.disabled = true;
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('invoice_type', document.getElementById('invoiceType').value);
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                loader.style.display = 'none';
                
                if (data.success) {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = '✅ Successfully uploaded to Airtable!';
                    
                    resultDiv.innerHTML = `
                        <h3>📊 Extracted Data:</h3>
                        <pre>${JSON.stringify(data.extracted_data, null, 2)}</pre>
                        <div class="record-id">
                            <strong>Airtable Record ID:</strong> ${data.airtable_id}
                        </div>
                    `;
                    resultDiv.style.display = 'block';
                    
                    setTimeout(() => {
                        fileInput.value = '';
                        fileName.textContent = '';
                        uploadBtn.disabled = false;
                    }, 2000);
                } else {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = '❌ Error: ' + data.error;
                    uploadBtn.disabled = false;
                }
            } catch (error) {
                loader.style.display = 'none';
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ Error: ' + error.message;
                uploadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
